name: Apply Codex Sync Patch

on:
  push:
    paths:
      - ".codex-sync/sync.patch"
      - ".github/workflows/apply-codex-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Codex patch
        run: |
          git apply --whitespace=nowarn .codex-sync/sync.patch
      - name: Commit synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py app.js styles.css
          if git diff --cached --quiet; then
            echo "No synced changes to commit."
            exit 0
          fi
          git commit -m "sync local terminal updates"
          git push
